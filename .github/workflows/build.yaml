name: Wails build

on:
  release:
    types: [ created ]

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  APP_NAME: 'Kafka-King'
  APP_WORKING_DIRECTORY: 'app'
  GO_VERSION: '1.25'
  NODE_VERSION: "22.x"

# https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
jobs:
  build-windows:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]  # amd64/x64

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install 7-Zip
        run: choco install 7zip

      - name: GoLang
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}

      - name: NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build & Compress
        shell: pwsh # 确保使用 PowerShell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          cd ${{ env.APP_WORKING_DIRECTORY }}
          wails build -ldflags="-X 'app/backend/common.Version=${{ github.ref_name }}'" -o ${{ env.APP_NAME }}.exe
          cd ..
          copy readme.md app\build\bin\
          copy LICENSE app\build\bin\
          & "C:\Program Files\7-Zip\7z.exe" a -t7z "${{ env.APP_NAME }}-${{ github.ref_name }}-windows-x64.7z" ".\app\build\bin\*" -r
          
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: "*.7z"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]  # macos-13是amd64，macos-latest是m1芯片

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: GoLang
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}

      - name: NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build & Compress
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          cd ${{ env.APP_WORKING_DIRECTORY }}
          wails build -ldflags "-X 'app/backend/common.Version=${{ github.ref_name }}'" -platform darwin/universal -o ${{ env.APP_NAME }} 
          chmod +x build/bin/*/Contents/MacOS/*
          mkdir -p _build/ _dist/
          cp -r ./build/bin/${{ env.APP_NAME }}.app _build/
          brew install create-dmg
          create-dmg \
            --no-internet-enable \
            --volname "${{ env.APP_NAME }}" \
            --volicon "_build/${{ env.APP_NAME }}.app/Contents/Resources/iconfile.icns" \
            --window-pos 400 400 \
            --window-size 660 450 \
            --icon "${{ env.APP_NAME }}.app" 180 180 \
            --icon-size 100 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 480 180 \
            "_dist/${{ env.APP_NAME }}-${{ github.ref_name }}-macos.dmg" \
            "_build/"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: | 
            ${{ env.APP_WORKING_DIRECTORY }}/_dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: GoLang
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version: ${{ env.GO_VERSION }}

      - name: NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build & Compress
        run: |
          ARCH=$(uname -m)
          sudo apt-get update && sudo apt-get install libgtk-3-dev libwebkit2gtk-4.0-dev build-essential
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          cd ${{ env.APP_WORKING_DIRECTORY }}
          wails build -ldflags="-X 'app/backend/common.Version=${{ github.ref_name }}'" -o ${{ env.APP_NAME }}
          cd ..
          mkdir _temp_dist
          cp readme.md _temp_dist/
          cp LICENSE _temp_dist/
          cp -r ${{ env.APP_WORKING_DIRECTORY }}/build/bin/* _temp_dist/
          chmod +x _temp_dist/*
          cd _temp_dist/
          tar -zcvf ${{ env.APP_NAME }}-${{ github.ref_name }}-ubuntu-x64.tar.gz *
          mv ${{ env.APP_NAME }}-${{ github.ref_name }}-ubuntu-x64.tar.gz ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
